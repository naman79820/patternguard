<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PatternGuard test page</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:20px auto;padding:0 16px;background:#fff;color:#222}.btn{padding:10px 18px;background:#1d5fbf;color:#fff;border:0;font-size:15px;min-width:200px}.faint{color:#d0d0d0;font-size:10px;margin-left:8px}</style></head><body><p>Controlled test page (made up).</p><div id="app"></div>
<script>
const app=document.getElementById('app');
function product(){app.innerHTML='<h2>Product</h2><p>Desk lamp</p><p id="price">Price ₹1,299</p><button class="btn" id="buy">Buy now</button>';document.getElementById('buy').onclick=()=>{location.hash='#checkout';};}
function checkout(){app.innerHTML='<h2>Checkout</h2><div id="item">Desk lamp ₹1,299</div><div id="platform">Platform fee ₹15</div><div id="total">Total ₹1,314</div>';}
function route(){location.hash==='#checkout'?checkout():product();}
window.addEventListener('hashchange',route);route();
</script></body></html>
