<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PatternGuard test page</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:20px auto;padding:0 16px;background:#fff;color:#222}.btn{padding:10px 18px;background:#1d5fbf;color:#fff;border:0;font-size:15px;min-width:200px}.faint{color:#d0d0d0;font-size:10px;margin-left:8px}</style></head><body><p>Controlled test page (made up).</p><p>Deal ends in <span id="timer">--:--</span></p>
<script>
// A real deadline: fixed once, then the countdown continues across reloads.
let end=parseInt(localStorage.getItem('deal-end')||'0',10);
if(!end||end<Date.now()){end=Date.now()+300000;localStorage.setItem('deal-end',String(end));}
const el=document.getElementById('timer');
function tick(){const s=Math.max(0,Math.round((end-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
tick();setInterval(tick,1000);
</script></body></html>
