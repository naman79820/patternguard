<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PatternGuard test page</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:20px auto;padding:0 16px;background:#fff;color:#222}.btn{padding:10px 18px;background:#1d5fbf;color:#fff;border:0;font-size:15px;min-width:200px}.faint{color:#d0d0d0;font-size:10px;margin-left:8px}</style></head><body><p>Controlled test page (made up).</p><p>Deal ends in <span id="timer">05:00</span></p>
<script>let s=300;const el=document.getElementById('timer');setInterval(()=>{s=Math.max(0,s-1);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000);</script></body></html>
