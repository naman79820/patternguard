<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Case 3: quick-commerce cart with dripped charges (reconstruction)</title>
<link rel="stylesheet" href="case.css">
</head>
<body>
<p class="banner">Reconstruction of a practice reported in <a href="https://www.business-standard.com/industry/news/ccpa-fines-indigo-zepto-bookmyshow-dark-patterns-quick-commerce-penalty-126080600580_1.html">Business Standard, Aug 2026</a> (CCPA action against a quick-commerce platform); not the real site. "Tokri Express" is a made-up name.</p>
<h1>Tokri Express</h1>
<div id="app"></div>
<script>
  // Two steps with history.pushState: ?step=cart and ?step=checkout.
  const app = document.getElementById('app');
  const items = 189, handling = 9, membership = 99;
  function cart() {
    app.innerHTML = `
      <section><h2>Your cart</h2>
        <div class="row"><span>Bananas, 6 pcs</span><span>₹54</span></div>
        <div class="row"><span>Toned milk, 1 L</span><span>₹68</span></div>
        <div class="row"><span>Brown bread</span><span>₹67</span></div>
        <div class="row total"><span>Item total</span><span>₹${items}</span></div>
      </section>
      <button class="btn" id="to-checkout">Proceed to checkout</button>`;
    document.getElementById('to-checkout').addEventListener('click', () => {
      history.pushState({}, '', '?step=checkout');
      render();
    });
  }
  function checkout() {
    app.innerHTML = `
      <section><h2>Bill details</h2>
        <div class="row"><span>Item total</span><span>₹${items}</span></div>
        <div class="row" id="handling"><span>Handling charge</span><span>₹${handling}</span></div>
        <div class="row" id="membership-line"><span>Membership fee</span><span>₹${membership}</span></div>
        <div class="row total"><span>To pay</span><span id="to-pay">₹${items + handling + membership}</span></div>
      </section>
      <section>
        <label><input type="checkbox" id="membership"> Tokri Plus membership, ₹${membership} for 3 months</label>
      </section>
      <button class="btn" id="place">Place order</button>`;
    const m = document.getElementById('membership');
    m.checked = true; // pre-included from code
    m.addEventListener('change', () => {
      document.getElementById('membership-line').style.display = m.checked ? '' : 'none';
      document.getElementById('to-pay').textContent = '₹' + (items + handling + (m.checked ? membership : 0));
    });
  }
  function render() {
    new URLSearchParams(location.search).get('step') === 'checkout' ? checkout() : cart();
  }
  window.addEventListener('popstate', render);
  render();
</script>
</body>
</html>
